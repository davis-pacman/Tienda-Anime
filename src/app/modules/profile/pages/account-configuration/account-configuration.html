<form [formGroup]="userForm" (ngSubmit)="guardarCambios()" class="card shadow-lg border-0 h-100"
    style="background-color: #1b2838; border-radius: 4px;">

    <!-- Banner -->
    <div style="height: 200px; background: linear-gradient(to right, #2a475e, #1b2838);"></div>

    <div class="card-body px-5 pb-5 position-relative">
        <!-- Avatar y Cabecera -->
        <div class="d-flex align-items-end" style="margin-top: -80px;">
            <div class="rounded-circle d-flex align-items-center justify-content-center text-white fw-bold shadow border border-4 border-dark"
                style="width: 150px; height: 150px; font-size: 4rem; background-color: #384f63;">
                {{ user()?.nombre?.charAt(0) | uppercase }}
            </div>
            <div class="ms-4 mb-3">
                <h1 class="text-white fw-bold display-5 m-0">{{ user()?.nombre }}</h1>
                <span class="text-info text-uppercase fw-bold" style="letter-spacing: 2px;">{{ user()?.role }}</span>
            </div>
        </div>

        <!-- Cuerpo del Formulario -->
        <div class="mt-5 p-4" style="background-color: #0f1922; border-radius: 2px;">
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="text-white small text-uppercase mb-1" for="nombre">Nombre</label>
                    <input type="text" formControlName="nombre" id="nombre"
                        class="form-control bg-dark text-white border-0 py-2">
                </div>
                <div class="col-md-6">
                    <label class="text-white small text-uppercase mb-1" for="apellidos">Apellidos</label>
                    <input type="text" formControlName="apellidos" id="apellidos"
                        class="form-control bg-dark text-white border-0 py-2">
                </div>
                <div class="col-md-12">
                    <label class="text-white small text-uppercase mb-1" for="correo">Correo Electrónico</label>
                    <input type="email" formControlName="correo" id="correo"
                        class="form-control bg-dark text-info border-0 py-2">
                </div>
                <div class="col-md-12">
                    <label class="text-white small text-uppercase mb-1" for="contrasenia">Contraseña</label>
                    <input type="email" formControlName="contrasenia" id="contrasenia"
                        class="form-control bg-dark text-info border-0 py-2">
                </div>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex gap-3 mt-5">
            <button type="submit" [disabled]="!userForm.valid" class="btn btn-lg text-white px-5"
                style="background-color: #66c0f4;">
                Guardar Cambios
            </button>
            <button type="button" routerLink="/store" class="btn btn-lg btn-outline-secondary px-4">
                Cancelar
            </button>
        </div>
    </div>
</form>
