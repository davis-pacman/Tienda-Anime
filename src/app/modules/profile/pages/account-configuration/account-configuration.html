<div class="container mt-5 d-flex justify-content-center animate__animated animate__fadeIn">

    @if (user()) {
    <div class="card bg-dark text-white border-secondary shadow-lg mb-5"
        style="max-width: 500px; width: 100%; border-radius: 15px;">

        <div class="card-header bg-black text-center border-secondary py-4"
            style="border-top-left-radius: 15px; border-top-right-radius: 15px;">
            <div class="position-relative d-inline-block">
                <div class="bg-warning text-black rounded-circle d-flex align-items-center justify-content-center mx-auto fw-bold shadow"
                    style="width: 90px; height: 90px; font-size: 2.5rem;">
                    {{ user()?.nombre?.charAt(0) | uppercase }}
                </div>
            </div>
            <h4 class="mt-3 text-warning mb-0 font-monospace">{{ user()?.nombre }}</h4>
            <span class="badge bg-danger text-uppercase px-3 py-1 mt-2"
                style="font-size: 0.75rem; letter-spacing: 1px;">
                {{ user()?.role }}
            </span>
        </div>

        <div class="card-body px-4 py-4">

            <div class="mb-3">
                <label class="text-white-50 small text-uppercase fw-bold font-monospace">Apellidos Completo</label>
                <div class="p-2 bg-black border border-secondary rounded text-white mt-1">
                    {{ user()?.apellidos || 'No registrado' }}
                </div>
            </div>

            <div class="mb-4">
                <label class="text-white-50 small text-uppercase fw-bold font-monospace">Correo Electrónico</label>
                <div class="p-2 bg-black border border-secondary rounded text-warning mt-1">
                    {{ user()?.correo }}
                </div>
            </div>

            <hr class="border-secondary my-4">

            <div class="d-grid gap-2">
                <a routerLink="/store" class="btn btn-outline-warning">
                    Volver al Inicio
                </a>
                <button (click)="logout()" class="btn btn-outline-danger btn-sm mt-2">
                    Cerrar Sesión Activa
                </button>
            </div>

        </div>
    </div>
    } @else {
    <div class="text-center text-muted mt-5">
        <div class="spinner-border text-warning mb-2" role="status"></div>
        <p class="font-monospace">Cargando datos del usuario...</p>
    </div>
    }

</div>
