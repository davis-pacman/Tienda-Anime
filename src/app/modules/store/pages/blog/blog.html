<section class="py-5 bg-black text-white min-vh-100">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="fw-bold text-warning">Blog de Akihabara</h2>
      <p class="text-white-50">Guías, recomendaciones y novedades para la comunidad otaku.</p>
    </div>

    <div class="row g-4">
      @for (post of posts; track post.id) {
        <div class="col-md-6">
          <div class="card h-100 bg-dark border-secondary">
            <img [src]="post.imagenUrl" [alt]="post.titulo" class="card-img-top" style="height: 220px; object-fit: cover;" />
            <div class="card-body">
              <div class="d-flex justify-content-between text-white-50 small mb-2">
                <span>{{ post.categoria }}</span>
                <span>{{ post.fecha }}</span>
              </div>
              <h4 class="text-light">{{ post.titulo }}</h4>
              <p class="text-white-50">{{ post.resumen }}</p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="text-warning small">{{ post.lecturaMinutos }} min de lectura</span>
                <a [routerLink]="['/store/blog', post.slug]" class="btn btn-outline-warning btn-sm">Leer más</a>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
