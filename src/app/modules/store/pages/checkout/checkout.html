<section class="py-5 bg-black text-white min-vh-100">
  <div class="container">
    <h2 class="fw-bold text-warning mb-4">Finalizar compra</h2>
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card bg-dark border-secondary p-4">
          <h4 class="text-light mb-3">Datos del cliente</h4>
          <form [formGroup]="checkoutForm" (ngSubmit)="submitOrder()" class="row g-3">
            <div class="col-md-6">
              <label class="form-label text-white-50">Nombre completo</label>
              <input formControlName="nombre" class="form-control bg-black text-white border-secondary" />
            </div>
            <div class="col-md-6">
              <label class="form-label text-white-50">Correo</label>
              <input formControlName="correo" type="email" class="form-control bg-black text-white border-secondary" />
            </div>
            <div class="col-md-6">
              <label class="form-label text-white-50">Teléfono</label>
              <input formControlName="telefono" class="form-control bg-black text-white border-secondary" />
            </div>
            <div class="col-md-6">
              <label class="form-label text-white-50">Método de pago</label>
              <select formControlName="metodoPago" class="form-select bg-black text-white border-secondary">
                <option value="Yape/Plin">Yape / Plin</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Tarjeta">Tarjeta</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label text-white-50">Dirección</label>
              <textarea formControlName="direccion" rows="3" class="form-control bg-black text-white border-secondary"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label text-white-50">Observaciones</label>
              <textarea formControlName="observacion" rows="2" class="form-control bg-black text-white border-secondary"></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-warning fw-bold" type="submit">Confirmar compra</button>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card bg-dark border-secondary p-4">
          <h4 class="text-warning mb-3">Resumen de pedido</h4>
          @for (item of items(); track item.productoId) {
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary">
              <div>
                <p class="mb-0 text-white">{{ item.nombre }}</p>
                <small class="text-white-50">x{{ item.cantidad }}</small>
              </div>
              <span class="text-warning">S/ {{ (item.precio * item.cantidad) | number: '1.2-2' }}</span>
            </div>
          }
          <div class="d-flex justify-content-between mt-3 fw-bold fs-5">
            <span>Total</span>
            <span class="text-warning">S/ {{ totalPrice | number: '1.2-2' }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
