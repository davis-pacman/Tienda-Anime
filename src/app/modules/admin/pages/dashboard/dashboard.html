<div class="container-fluid p-4 p-md-5 flex-grow-1">

    <!-- SECCIÓN DE CABECERA -->
    <div class="row mb-5 align-items-center">
        <div class="col-12 d-flex flex-column align-items-center justify-content-center">
            <!-- El mensaje principal solicitada -->
            <h1 class="display-4 fw-bold text-dark mb-2">¡BIENVENIDO, Administrador!</h1>
            <p class="lead text-muted fs-4">Este es tu resumen general del estado del sistema hoy.</p>
        </div>
    </div>

    <!-- TARJETAS DE KPIs RESUMEN (Grid de 4 columnas responsivo) -->
    <div class="row g-4 mb-5">
        <!-- Tarjeta 1 -->
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="card border-0 shadow-sm rounded-3 bg-white h-100">
                <div class="card-body d-flex align-items-center p-4">
                    <div class="flex-shrink-0 bg-primary bg-opacity-10 p-3 rounded-circle me-3 text-primary">
                        <i class="bi bi-people-fill fs-3"></i>
                    </div>
                    <div>
                        <h6 class="card-title text-muted mb-1 fs-7 text-uppercase">Usuarios Totales</h6>
                        <p class="card-text fs-2 fw-bold text-dark m-0">{{nUsuarios}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
