<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Categorías</h2>
        <a routerLink="/admin/newcategory" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Nueva Categoría
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="ps-3">ID</th>
                        <th>Nombre</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Ejemplo de fila, aquí iterarás con *ngFor -->
                    @for (cat of listCategorias; track cat.id) {
                    <tr>
                        <td class="ps-3 text-muted"><code>{{ cat.id }}</code></td>
                        <td><strong>{{ cat.nombre }}</strong></td>
                        <td class="text-center">
                            <a class="btn btn-sm btn-outline-warning me-2"
                                [routerLink]="['/admin/editcategory', cat.id]"><i
                                    class="bi bi-pencil me-2 text-primary"></i> Editar</a>

                            <button class="btn btn-sm btn-outline-danger"
                                (click)="eliminarCategoria(cat.id, cat.nombre)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>}
                </tbody>
            </table>
        </div>
    </div>
</div>
