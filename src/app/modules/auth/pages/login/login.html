<div class="min-vh-100 bg-black d-flex align-items-center justify-content-center py-5 px-3">
    <div class="card bg-dark border-secondary shadow-lg w-100" style="max-width: 450px;">

        <div class="card-body p-4 p-md-5 text-center">

            <h2 class="text-warning fw-bold mb-1 fs-2"> Inicio de Sesion</h2>

            <p class="text-white-50 small mb-4">Ingresa tus credenciales para continuar tu aventura</p>

            <form (submit)="$event.preventDefault(); manejarLogin(txtEmail.value, txtPassword.value)">

                <div class="mb-3 text-start">
                    <label for="loginEmail" class="form-label text-light small fw-semibold">Correo
                        Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text bg-black border-secondary text-white-50">
                            <i class="bi bi-envelope-fill"></i>
                        </span>
                        <input #txtEmail type="email" id="loginEmail" name="email" placeholder="ejemplo@correo.com"
                            class="form-control bg-dark text-white border-secondary opacity-75" required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="loginPassword"
                            class="form-label text-light small fw-semibold mb-0">Contraseña</label>
                        <a href="#" class="text-warning text-decoration-none small opacity-75">¿La olvidaste?</a>
                    </div>
                    <div class="input-group">
                        <span class="input-group-text bg-black border-secondary text-white-50">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input #txtPassword type="password" id="loginPassword" name="password" placeholder="••••••••"
                            class="form-control bg-dark text-white border-secondary opacity-75" required>
                    </div>
                </div>

                <button class="btn btn-warning w-100 fw-bold py-2 mb-3 shadow" type="submit">
                    <i class="bi bi-box-arrow-in-right"></i> Ingresar
                </button>

                <div class="d-flex align-items-center my-3">
                    <hr class="flex-grow-1 border-secondary">
                    <span class="mx-3 text-white-50 small">O</span>
                    <hr class="flex-grow-1 border-secondary">
                </div>

                <p class="text-white-50 small mb-0">
                    ¿Nuevo en la tienda?
                    <a routerLink="/auth/register" class="text-warning fw-bold text-decoration-none">Regístrate aquí</a>
                </p>
                <p class="text-white-50 small mb-0">
                    ¿Tienda?
                    <a routerLink="/store/" class="text-warning fw-bold text-decoration-none">Ir a la tienda</a>
                </p>

            </form>
        </div>

    </div>
</div>
